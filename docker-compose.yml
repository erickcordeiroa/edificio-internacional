services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edificio-app
    container_name: edificio-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
      - assets:/var/www/public/build
    networks:
      - edificio-network

  db:
    image: mysql:8.0
    container_name: edificio-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - edificio-network

  nginx:
    image: nginx:alpine
    container_name: edificio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - assets:/var/www/public/build
      - ./docker/nginx:/etc/nginx/conf.d
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    networks:
      - edificio-network
    depends_on:
      - app
      - db

  certbot:
    image: certbot/certbot
    container_name: edificio-certbot
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  edificio-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  assets:
    driver: local
